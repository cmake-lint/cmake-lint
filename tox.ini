[tox]
envlist = py311, py312, py313, py314, py315, pypy311

[gh-actions]
python =
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314
  3.15: py315
  pypy-3.11: pypy311

[testenv]

deps =
  py311: ruff
  py311: mypy

commands =
  {envpython} -m pip install .[dev]
  {envpython} -m pytest
  py311: mypy cmakelint --ignore-missing-imports
  py311: ruff check .
