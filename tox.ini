[tox]
envlist = py38, py39, py310, py311, py312, py313, py314, py315, pypy39, pypy310

[gh-actions]
python =
  3.8: py38
  3.9: py39
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314
  3.15: py315
  pypy-3.9: pypy39
  pypy-3.10: pypy310

[testenv]

deps =
  py310: ruff
  py38: mypy

commands =
  {envpython} -m pip install .[dev]
  {envpython} -m pytest
  py38: mypy cmakelint --ignore-missing-imports
  py310: ruff check .
